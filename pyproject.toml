[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-ai"
version = "1.0.0"
description = "Local-first AI analytics portfolio application with CrewAI and MCP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "crewai>=1.15,<2",
  "streamlit>=1.36",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pwdlib[argon2]>=0.2",
  "PyJWT>=2.9",
  "python-dotenv>=1.0",
  "plotly>=5.23",
  "sqlglot>=25.0",
  "reportlab>=4.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.30,<2"]
dev = ["pytest>=8.3", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
